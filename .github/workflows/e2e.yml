name: E2E (Playwright)

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # polni funkcionalni testi (TS-01 do TS-03) se zaženejo ročno

env:
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web-template
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './web-template/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright (če ni v package.json)
        run: npm ls @playwright/test > /dev/null 2>&1 || npm install --no-save --no-audit --no-fund @playwright/test@1.63.0 @types/node

      - name: Install browser (Chromium)
        run: npx playwright install --with-deps chromium

      # Na pull requestu tečejo samo testi brez zaledja (TC-00). Ostali se preskočijo, ker računov ni.
      - name: Run E2E tests
        env:
          E2E_USER_EMAIL: ${{ github.event_name == 'workflow_dispatch' && secrets.E2E_USER_EMAIL || '' }}
          E2E_USER_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.E2E_USER_PASSWORD || '' }}
          E2E_THERAPIST_EMAIL: ${{ github.event_name == 'workflow_dispatch' && secrets.E2E_THERAPIST_EMAIL || '' }}
          E2E_THERAPIST_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.E2E_THERAPIST_PASSWORD || '' }}
        run: npx playwright test

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web-template/e2e-report
            web-template/e2e-results
          if-no-files-found: ignore
