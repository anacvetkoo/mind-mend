name: MindMend CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./web-template

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: './web-template/package-lock.json'

    - name: Install dependencies
      run: npm install

    - name: Run TypeScript Check
      run: npm run build --noEmit
      continue-on-error: true

    - name: Run Unit Tests
      run: npm run test