name: MindMend CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./web-template

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: './web-template/package-lock.json'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Run TypeScript Check
      run: npm run build --noEmit
      continue-on-error: true

    - name: Run Unit Tests
      run: npm run test

    - name: Build Application
      run: npm run build

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: production-dist
        path: ./web-template/dist 

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: production-dist
        path: ./web-template/dist # Prepričaj se, da se pot ujema z mapo v firebase.json (npr. dist ali build)

    - name: Deploy to Firebase Hosting
      uses: w9jds/firebase-action@v13.4.0
      with:
        args: deploy --only hosting
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        PROJECT_PATH: ./web-template # GitHub Actions povemo, kje se nahajata datoteki firebase.json in .firebaserc